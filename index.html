<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion 2.5 Web</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:12px "Segoe UI",Tahoma,Verdana,Arial,sans-serif;color:#111;background:#f0f0f0;user-select:none;-webkit-user-select:none}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],select,textarea{border:1px solid #aab;background:#fff;padding:1px 3px;border-radius:0;min-width:0}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:1px solid #3a8ee6}
textarea,input[type=text]{user-select:text;-webkit-user-select:text}
button.btn{min-width:74px;padding:3px 12px;border:1px solid #adadad;background:#e1e1e1;border-radius:2px}
button.btn:hover{background:#e5f1fb;border-color:#0078d7}
button.btn.primary{border-color:#0078d7;box-shadow:inset 0 0 0 1px #0078d7}
button.btn.small{min-width:0;padding:1px 7px}
#app{display:flex;flex-direction:column;height:100vh}
#menubar{display:flex;align-items:center;background:#fff;border-bottom:1px solid #dcdcdc;padding:0 2px;flex:none}
#menubar .logo{display:flex;align-items:center;padding:0 6px 0 4px}
.mb-item{padding:4px 9px;cursor:default}
.mb-item:hover,.mb-item.open{background:#cce8ff}
#toolbar{display:flex;align-items:center;gap:1px;padding:2px 4px;background:#f0f0f0;border-bottom:1px solid #c4c4c4;flex:none;flex-wrap:wrap}
.tb{width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;background:none;padding:0;cursor:default}
.tb:hover{background:#d8eaf9;border-color:#7da2ce}
.tb.on{background:#c2dcf5;border-color:#5a9bd8}
.tb.dis{opacity:.35;pointer-events:none}
.tb-sep{width:1px;height:20px;background:#c0c0c0;margin:0 4px}
#toolbar select{height:22px;margin:0 2px}
#main{display:flex;flex:1;min-height:0}
#left{width:250px;display:flex;flex-direction:column;flex:none;border-right:1px solid #9a9a9a}
#center{flex:1;display:flex;flex-direction:column;min-width:0;background:#6d7b93}
#right{width:170px;flex:none;display:flex;flex-direction:column;border-left:1px solid #9a9a9a}
.pane{display:flex;flex-direction:column;background:#fff;min-height:0}
.pane-title{background:linear-gradient(#e7eef8,#cfdbec);border-bottom:1px solid #9fb0c8;padding:3px 6px;font-weight:600;color:#1e395b;flex:none;display:flex;justify-content:space-between;align-items:center}
.pane-body{flex:1;overflow:auto;min-height:0}
#ws-pane{flex:0 0 38%}
#props-pane{flex:1;border-top:1px solid #9a9a9a}
#layers-pane{flex:1}
#library{flex:none;height:112px;border-top:1px solid #9a9a9a}
#lib-body{display:flex;flex:1;min-height:0}
#lib-cats{width:150px;border-right:1px solid #ccc;overflow:auto;flex:none}
#lib-cats div{padding:3px 8px}
#lib-cats div.sel{background:#cce8ff}
#lib-items{flex:1;display:flex;gap:4px;padding:4px;overflow-x:auto;align-items:flex-start}
.lib-item{width:74px;height:78px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:1px solid transparent;padding:2px;text-align:center;font-size:11px;overflow:hidden}
.lib-item:hover{border-color:#7da2ce;background:#e8f2fc}
.lib-item canvas{max-width:60px;max-height:48px;margin:auto;image-rendering:pixelated}
#status{flex:none;display:flex;justify-content:space-between;background:#f0f0f0;border-top:1px solid #c4c4c4;padding:2px 8px;color:#333}
/* tree */
.tree-node{display:flex;align-items:center;gap:4px;padding:2px 4px;white-space:nowrap;cursor:default}
.tree-node:hover{background:#e5f3ff}
.tree-node.sel{background:#cce8ff;outline:1px solid #99d1ff}
.tree-node .tw{width:10px;text-align:center;color:#666;font-size:9px}
.tree-node canvas,.tree-node svg{flex:none}
/* props */
#props-tabs{display:flex;background:#f0f0f0;border-bottom:1px solid #b4b4b4;flex:none;padding:2px 2px 0}
.ptab{width:26px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
.ptab.sel{background:#fff;border-color:#b4b4b4}
.ptab:hover{background:#e5f3ff}
.pg-head{background:#e9eef5;font-weight:600;padding:3px 6px;border-bottom:1px solid #d5dbe5;border-top:1px solid #d5dbe5;color:#1e395b}
.pg-row{display:flex;border-bottom:1px solid #ececec;min-height:22px;align-items:stretch}
.pg-l{flex:0 0 46%;padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #ececec}
.pg-v{flex:1;display:flex;align-items:center;min-width:0;padding:1px 2px;gap:2px}
.pg-v input[type=text],.pg-v input[type=number],.pg-v select,.pg-v textarea{width:100%;border:1px solid transparent;background:transparent;height:20px}
.pg-v textarea{height:60px;border-color:#ccd;resize:vertical}
.pg-v input:hover,.pg-v select:hover{border-color:#aab}
.pg-v input[type=color]{width:44px;height:18px;padding:0;border:1px solid #999}
.pg-v button{width:100%}
.pg-title{padding:4px 6px;font-weight:600;background:#fafafa;border-bottom:1px solid #ddd;display:flex;gap:6px;align-items:center}
/* layers */
.layer{display:flex;align-items:center;gap:4px;padding:3px 4px;border-bottom:1px solid #e6e6e6}
.layer.sel{background:#cce8ff}
.layer .lb{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:1px solid #bbb;background:#fafafa}
.layer .lb.off{opacity:.3}
.layer .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers-bar{display:flex;gap:2px;padding:3px;border-bottom:1px solid #ccc;background:#f4f4f4}
/* editor title */
#ed-title{flex:none;display:flex;align-items:center;gap:6px;background:linear-gradient(#f7f9fc,#dfe6f0);border-bottom:1px solid #8795ab;padding:3px 8px;font-weight:600;color:#1e395b}
#ed-title .sp{flex:1}
#ed-title select{font-weight:400;height:20px}
#editor{flex:1;min-height:0;position:relative;overflow:hidden}
#fe-wrap{position:absolute;inset:0;overflow:auto;background:#6d7b93}
#fe-cv{display:block}
/* storyboard */
#sb-wrap{position:absolute;inset:0;overflow:auto;background:#fff}
table.sb{border-collapse:collapse;width:100%}
table.sb th{background:#f0f0f0;border:1px solid #c8c8c8;padding:4px 8px;text-align:left;position:sticky;top:0}
table.sb td{border:1px solid #dcdcdc;padding:6px 8px;vertical-align:middle}
table.sb td.n{width:34px;text-align:center;background:#e9e9e9;font-weight:600}
table.sb tr.sel td{background:#e5f3ff}
table.sb tr.sel td.n{background:#99d1ff}
table.sb canvas{border:1px solid #666;box-shadow:2px 2px 0 #bbb;display:block}
table.sb input[type=text]{width:100%;height:22px}
table.sb input[type=number]{width:64px;height:22px}
/* event editor */
#ev-wrap{position:absolute;inset:0;overflow:auto;background:#fff}
table.ev{border-collapse:separate;border-spacing:0}
table.ev th{position:sticky;top:0;z-index:4;background:#f0f0f0;border-right:1px solid #c4c4c4;border-bottom:1px solid #7a7a7a;height:40px;min-width:38px;width:38px;padding:2px;font-weight:400}
table.ev th.h-num{left:0;z-index:6;min-width:36px;width:36px}
table.ev th.h-cond{left:36px;z-index:6;min-width:380px;text-align:left;padding:2px 8px;border-right:1px solid #7a7a7a;font-size:11px;color:#333;line-height:16px}
table.ev th:hover{background:#e5f3ff}
table.ev td{border-right:1px solid #dedede;border-bottom:1px solid #d0d0d0;height:26px;vertical-align:top}
table.ev td.num{position:sticky;left:0;z-index:2;background:#e9e9e9;min-width:36px;width:36px;text-align:center;color:#333;border-right:1px solid #aaa;padding-top:5px;cursor:default}
table.ev td.conds{position:sticky;left:36px;z-index:2;background:#fff;min-width:380px;max-width:520px;border-right:1px solid #7a7a7a;padding:2px 6px}
table.ev tr.event:nth-child(even) td.conds{background:#fbfbfd}
table.ev tr.sel td.num{background:#3a8ee6;color:#fff}
table.ev tr.sel td.conds{background:#e5f3ff!important}
table.ev td.cell{text-align:center;vertical-align:middle;cursor:default;min-width:38px}
table.ev td.cell:hover{background:#e5f3ff;outline:1px solid #99d1ff;outline-offset:-1px}
table.ev td.cell .ck{color:#111;font-size:15px;font-weight:700}
table.ev tr.event:hover td.cell{background:#f6faff}
table.ev tr.event:hover td.cell:hover{background:#d8ecff}
.cond{display:flex;align-items:center;gap:5px;padding:2px 2px;line-height:16px;border:1px solid transparent}
.cond:hover{background:#e5f3ff;border-color:#99d1ff}
.cond .bul{color:#444;width:8px;flex:none}
.cond .neg{color:#d00;font-weight:700}
.cond canvas,.cond svg,.actl canvas,.actl svg{flex:none}
.cond.or{color:#06c;font-weight:700;justify-content:center}
.acts{margin:2px 0 3px 22px;border-left:2px solid #cfd8e6;padding-left:6px}
.actl{display:flex;align-items:center;gap:5px;padding:1px 2px;border:1px solid transparent;color:#1b3c6e}
.actl:hover{background:#e5f3ff;border-color:#99d1ff}
.actl.add{color:#888;font-style:italic}
table.ev.list td.conds,table.ev.list th.h-cond{min-width:820px;max-width:none}
tr.newcond td.conds{color:#777;cursor:default;padding:5px 8px}
tr.newcond td.conds:hover{background:#e5f3ff;color:#000}
tr.comment td.ctext{position:sticky;left:36px;padding:5px 10px;font-weight:600;white-space:pre-wrap}
tr.group td.gtext{position:sticky;left:36px;padding:4px 6px;font-weight:700;background:#dfe7f3;color:#1e395b;border-bottom:1px solid #9fb0c8}
tr.group td.gtext .tw{display:inline-block;width:14px;cursor:default}
tr.group.off td.gtext{color:#888;font-style:italic}
tr.drop td{border-top:2px solid #0078d7}
.hovertip{position:fixed;z-index:9000;background:#ffffe1;border:1px solid #767676;padding:4px 8px;box-shadow:2px 2px 4px rgba(0,0,0,.25);pointer-events:none;max-width:420px}
.hovertip div{display:flex;gap:5px;align-items:center;padding:1px 0}
/* menus */
.menu{position:fixed;z-index:9500;background:#f9f9f9;border:1px solid #a0a0a0;box-shadow:3px 3px 8px rgba(0,0,0,.3);padding:2px;min-width:150px;max-height:92vh;overflow-y:auto}
.mi{position:relative;padding:4px 30px 4px 28px;white-space:nowrap;cursor:default;display:flex;align-items:center}
.mi:hover,.mi.open{background:#cce8ff}
.mi.dis{color:#9a9a9a}
.mi.dis:hover{background:none}
.mi .chk{position:absolute;left:8px}
.mi .mic{position:absolute;left:5px;top:3px;display:flex}
.mi .arrow{position:absolute;right:7px;font-size:10px}
.mi .key{margin-left:auto;padding-left:24px;color:#555}
.msep{height:1px;background:#d0d0d0;margin:3px 1px}
/* dialogs */
.dlg-back{position:fixed;inset:0;background:rgba(40,50,70,.22);z-index:500}
.dlg{position:fixed;background:#f0f0f0;border:1px solid #3d6db5;box-shadow:0 8px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;max-width:98vw;max-height:97vh}
.dlg-title{background:#fff;padding:6px 6px 6px 10px;display:flex;justify-content:space-between;align-items:center;cursor:move;flex:none;border-bottom:1px solid #ddd}
.dlg-title .x{width:28px;height:20px;display:flex;align-items:center;justify-content:center;cursor:default}
.dlg-title .x:hover{background:#e81123;color:#fff}
.dlg-body{padding:10px;overflow:auto;flex:1;min-height:0}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;padding:8px 10px;flex:none;background:#f0f0f0}
.frm-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.frm-row>label{flex:0 0 130px}
.frm-row>.fv{flex:1;display:flex;gap:4px;align-items:center;min-width:0}
.frm-row input[type=text]{flex:1;height:22px}
.frm-row input[type=number]{width:72px;height:22px}
.objgrid{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid #aaa;padding:8px;min-height:90px;max-height:360px;overflow:auto;align-content:flex-start}
.objcell{width:76px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;border:1px solid transparent;text-align:center;font-size:11px;overflow:hidden;line-height:12px}
.objcell:hover{background:#e5f3ff;border-color:#99d1ff}
.objcell.sel{background:#cce8ff;border-color:#3a8ee6}
.objcell .ic{height:40px;display:flex;align-items:center;justify-content:center}
.expr-ta{width:100%;height:90px;font:13px Consolas,"Courier New",monospace;resize:vertical}
.expr-err{color:#c00;min-height:16px;margin:4px 0}
.expr-objs{display:flex;flex-wrap:wrap;gap:3px;background:#fff;border:1px solid #aaa;padding:4px;max-height:96px;overflow:auto}
.expr-objs .eo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
.expr-objs .eo:hover{background:#e5f3ff;border-color:#99d1ff}
.keypad{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
.keypad button{min-width:30px;padding:2px 6px;border:1px solid #adadad;background:#e9e9e9}
.keypad button:hover{background:#e5f1fb;border-color:#0078d7}
.dial{position:relative;width:200px;height:200px;margin:4px auto;background:#fff;border:1px solid #aaa;border-radius:50%}
.dial .d{position:absolute;width:14px;height:14px;margin:-7px;border:1px solid #666;background:#eee;border-radius:50%;font-size:8px;line-height:12px;text-align:center}
.dial .d:hover{background:#cce8ff}
.dial .d.on{background:#1a73e8;border-color:#0b3d91;color:#fff}
.dial .d.has{box-shadow:0 0 0 2px #2a2}
.dial .c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#555;text-align:center;font-size:11px}
/* picture editor */
.pe{display:flex;flex-direction:column;width:min(1000px,96vw);height:min(690px,88vh)}
.pe-top{display:flex;gap:2px;align-items:center;padding:3px;border-bottom:1px solid #c4c4c4;flex:none;flex-wrap:wrap}
.pe-mid{display:flex;flex:1;min-height:0}
.pe-tools{width:64px;flex:none;display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px;padding:4px;border-right:1px solid #c4c4c4}
.pe-tools .tb{width:26px;height:26px}
.pe-view{flex:1;overflow:auto;background:#8a8a8a;display:flex;min-width:0}
.pe-view canvas{margin:auto;display:block;flex:none;cursor:crosshair;box-shadow:0 0 0 1px #000}
.pe-right{width:150px;flex:none;border-left:1px solid #c4c4c4;padding:6px;overflow:auto}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;margin-bottom:6px}
.pal div{height:15px;border:1px solid #777}
.pal div:hover{outline:2px solid #fff;z-index:1}
.pe-cur{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.pe-cur .sw{width:36px;height:36px;border:2px solid #000;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,#fff 25%,#fff 75%,#ccc 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.pe-cur .sw i{display:block;width:100%;height:100%}
.pe-anim{flex:none;border-top:1px solid #c4c4c4;display:flex;height:168px}
.pe-anim .col{padding:5px;border-right:1px solid #d0d0d0;display:flex;flex-direction:column;gap:4px}
.pe-anim select[size]{width:128px;flex:1}
.pe-frames{flex:1;display:flex;flex-direction:column;min-width:0}
.pe-strip{flex:1;display:flex;gap:5px;overflow-x:auto;padding:6px;align-items:center;background:#fff}
.pe-fr{flex:none;width:72px;height:92px;border:1px solid #bbb;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px;background:#f6f6f6;font-size:11px}
.pe-fr.sel{border-color:#0078d7;background:#cce8ff;box-shadow:0 0 0 1px #0078d7}
.pe-fr canvas{max-width:62px;max-height:62px;image-rendering:pixelated;margin:auto}
.pe-anim .dial{width:120px;height:120px;margin:0}
.pe-anim .dial .d{width:10px;height:10px;margin:-5px;font-size:0}
/* run window */
.run-back{background:rgba(20,24,34,.55);z-index:8000}
.run-win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #3d6db5;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#000;display:flex;flex-direction:column}
.run-win .dlg-title{cursor:default}
.run-win canvas{display:block;outline:none}
kbd{background:#fff;border:1px solid #aaa;border-bottom-width:2px;border-radius:3px;padding:0 4px;font:11px Consolas,monospace}
.help h3{margin:10px 0 4px;color:#1e395b}.help p,.help li{line-height:17px;margin:3px 0}.help ul{margin:2px 0;padding-left:20px}.help{user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="main">
    <div id="left">
      <div class="pane" id="ws-pane"><div class="pane-title">Workspace Toolbar</div><div id="workspace" class="pane-body"></div></div>
      <div class="pane" id="props-pane"><div class="pane-title">Properties</div><div id="props-tabs"></div><div id="props" class="pane-body"></div></div>
    </div>
    <div id="center"><div id="ed-title"></div><div id="editor"></div></div>
    <div id="right"><div class="pane" id="layers-pane"><div class="pane-title">Layers Toolbar</div><div id="layers" class="pane-body"></div></div></div>
  </div>
  <div id="library" class="pane"><div class="pane-title">Library Toolbar</div><div id="lib-body"><div id="lib-cats"></div><div id="lib-items"></div></div></div>
  <div id="status"><span id="st-msg">Ready</span><span id="st-pos"></span></div>
</div>
<input type="file" id="file-open" accept=".json,.fusion,application/json" hidden>
<script id="fx-core">
'use strict';
/* ===================================================================
   Fusion 2.5 Web - core (shared by the editor and exported games)
   =================================================================== */
const SPD=6.25;            // pixels per second for one unit of Fusion speed
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const OBJ_TYPES=['active','string','counter','score','lives','button'];
const SYS=[['special','Special'],['sound','Sound'],['story','Storyboard controls'],['create','Create new objects'],['player','Player 1 - mouse & keyboard'],['timer','The timer']];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
const ctx2d=cv=>cv.getContext('2d',{willReadFrequently:true});
const MEAS=ctx2d(mkCanvas(1,1));

/* ---------- image bank ---------- */
const Img={
  store:new Map(),seq:1,
  add(cv,hx,hy,ax,ay){const id=this.seq++;this.store.set(id,{id,cv,w:cv.width,h:cv.height,hx:hx|0,hy:hy|0,ax:ax==null?cv.width>>1:ax|0,ay:ay==null?cv.height>>1:ay|0});return id},
  get(id){return this.store.get(id)},
  mask(im){if(!im.mask){const d=ctx2d(im.cv).getImageData(0,0,im.w,im.h).data,m=new Uint8Array(im.w*im.h);for(let i=0;i<m.length;i++)m[i]=d[i*4+3]>90?1:0;im.mask=m}return im.mask},
  serialize(ids){const o={};for(const id of ids){const im=this.store.get(id);if(im){if(!im.src)im.src=im.cv.toDataURL('image/png');o[id]={src:im.src,hx:im.hx,hy:im.hy,ax:im.ax,ay:im.ay}}}return o},
  async load(obj){this.store.clear();let max=0;
    await Promise.all(Object.entries(obj||{}).map(([id,d])=>new Promise(res=>{const i=new Image();
      i.onload=()=>{const cv=mkCanvas(i.width,i.height);ctx2d(cv).drawImage(i,0,0);this.store.set(+id,{id:+id,cv,w:cv.width,h:cv.height,hx:d.hx|0,hy:d.hy|0,ax:d.ax|0,ay:d.ay|0,src:d.src});res()};
      i.onerror=()=>res();i.src=d.src;max=Math.max(max,+id)})));
    this.seq=max+1}
};
function firstImage(oi){const a=oi.anims&&oi.anims.stopped;if(a)for(const k of Object.keys(a.dirs).sort((x,y)=>x-y))if(a.dirs[k].length)return a.dirs[k][0];if(oi.anims)for(const n in oi.anims)for(const k in oi.anims[n].dirs)if(oi.anims[n].dirs[k].length)return oi.anims[n].dirs[k][0];return null}
function projectImageIds(P){const s=new Set();for(const f of P.frames)for(const o of f.objects){if(o.type==='backdrop'&&o.image!=null)s.add(o.image);if(o.anims)for(const n in o.anims)for(const k in o.anims[n].dirs)for(const id of o.anims[n].dirs[k])s.add(id)}return s}
let HEART=null;

const Snd={

  play(name,loop,sounds){const ac=this.ac();if(!ac)return;const cu=(sounds||[]).find(s=>s.name===name);

const MENUS=[];let MBOPEN=false;

    const d=h('div',{class:'mi'+(it.dis?' dis':'')},it.chk?h('span',{class:'chk'},'✓'):null,it.icon?h('span',{class:'mic'},it.icon):null,h('span',null,it.label),it.key?h('span',{class:'key'},it.key):null,it.sub?h('span',{class:'arrow'},'▶'):null);

    const body=h('div',{class:'dlg-body'},o.body),btns=h('div',{class:'dlg-btns'}),dlg=h('div',{class:'dlg'});

/* ---------- run / build ---------- */
function runApp(single){
  stopRun();closeMenus(0);hideTip();if(PLACING)cancelPlacing();
  const data=clone(P),cv=h('canvas',{tabindex:'0'}),sc=Math.min(1,(innerWidth-40)/P.window.w,(innerHeight-90)/P.window.h);
  const win=h('div',{class:'run-win'},h('div',{class:'dlg-title'},h('span',null,P.name+(single?' - '+frame().name:'')+'   (Esc to stop)'),h('span',{class:'x',title:'Stop (Esc)',onclick:()=>stopRun()},'✕')),cv),back=h('div',{class:'dlg-back run-back'},win);
  document.body.append(back);const rt=new Runtime(data,cv,{single,onEnd:()=>stopRun()});rt.el=back;RT=rt;
  cv.style.width=Math.round(P.window.w*sc)+'px';cv.style.height=Math.round(P.window.h*sc)+'px';
  try{rt.start(single?CF:0)}catch(e){stopRun();msgBox('The application could not start:\n'+e.message);return}
  cv.focus();updateToolbar();status('Running - press Esc to stop')}
function stopRun(){if(!RT)return;const r=RT;RT=null;r.stop();if(r.el)r.el.remove();updateToolbar();status('Ready')}
function buildHTML(){
  const data=serializeProject(),core=document.getElementById('fx-core').textContent,json=JSON.stringify(data).replace(/</g,'\\u003c');
  return'<!DOCTYPE html>\n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(P.name)+'</title>\n<style>html,body{margin:0;height:100%;background:'+P.border+';overflow:hidden}body{display:flex;align-items:center;justify-content:center}canvas{max-width:100vw;max-height:100vh;outline:none;touch-action:none}</style></head>\n<body><canvas id="game" tabindex="0"></canvas>\n<script>'+core+'<\/script>\n<script>fxBoot('+json+',document.getElementById("game"));<\/script>\n</body></html>'}
function cmdExport(){download(fileBase()+'.html',buildHTML(),'text/html');status('Built '+fileBase()+'.html')}

/* ---------- file commands ---------- */
function resetState(){CF=0;SEL=[];CURLAYER=0;UNDO.length=0;REDO.length=0;EVSEL=null;PROPSEL={kind:'frame'};PLACING=null;VIEW='frame';dirty()}
async function cmdNew(){if(!await confirmBox('Create a new application?\nChanges that were not saved to a file will be lost.'))return;P=newProject();P.frames.push(newFrame('Frame 1'));resetState();refreshAll()}
function cmdOpen(){const i=$('#file-open');i.value='';i.onchange=async()=>{const fl=i.files[0];if(!fl)return;try{await loadProjectData(JSON.parse(await fl.text()));VIEW='story';dirty();refreshAll();status('Loaded '+fl.name)}catch(e){msgBox('Cannot open this file.\n'+e.message)}};i.click()}
function cmdSave(){download(fileBase()+'.fusion.json',JSON.stringify(serializeProject()),'application/json');status('Application saved as '+fileBase()+'.fusion.json')}
async function loadExample(k){if(!await confirmBox('Load the example "'+EXAMPLES[k].title+'"?\nChanges that were not saved to a file will be lost.'))return;EXAMPLES[k].build();resetState();CF=EXAMPLES[k].start;refreshAll()}
async function dataElements(){
  const box=h('div',{style:{width:'420px'}});
  const draw=()=>{box.innerHTML='';box.append(h('div',{class:'pg-head'},'Samples of the application'));
    if(!P.sounds.length)box.append(h('div',{style:{padding:'8px',color:'#777'}},'No imported sample yet.'));
    P.sounds.forEach((s,i)=>box.append(h('div',{class:'frm-row',style:{margin:'4px 0'}},h('span',{style:{flex:1}},s.name),h('button',{class:'btn small',onclick:()=>Snd.play(s.name,false,P.sounds)},'▶ Play'),h('button',{class:'btn small',onclick:()=>{pushUndo();P.sounds.splice(i,1);draw()}},'Delete'))));
    box.append(h('button',{class:'btn',style:{margin:'6px 0 12px'},onclick:async()=>{const files=await pickFiles('audio/*',true);for(const fl of files){if(fl.size>3e6){msgBox(fl.name+' is larger than 3 MB and was skipped.');continue}const src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(fl)});pushUndo();let nm=fl.name.replace(/\.[^.]+$/,'');while(soundNames().includes(nm))nm+='_';P.sounds.push({name:nm,src})}draw()}},'Import sound files…'),
      h('div',{class:'pg-head'},'Built-in samples (always available)'),h('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px',padding:'6px 0'}},Snd.presets.map(n=>h('button',{class:'btn small',onclick:()=>Snd.play(n)},'▶ '+n))))};
  draw();await openDialog({title:'Data elements - Sounds',body:box,buttons:[{label:'Close',primary:true}]})}
function showHelp(){openDialog({title:'Quick start guide',width:640,buttons:[{label:'Close',primary:true}],body:h('div',{class:'help',html:
  '<p><b>Fusion 2.5 Web</b> lets you make games without programming, the Fusion way: place objects in frames, then describe the game in the grid of the event editor.</p>'+
  '<h3>1. Storyboard Editor</h3><p>An application is a list of <b>frames</b> (title screen, levels…). Add, rename, resize and reorder them here.</p>'+
  '<h3>2. Frame Editor</h3><ul><li><b>Double-click</b> an empty area (or <i>Insert &gt; New Object</i>) to create an object: Active, Backdrop, Quick Backdrop, String, Counter, Score, Lives, Button. You can also drag ready-made objects from the <b>Library</b> at the bottom.</li><li>Drag objects to move them, use the handles to resize, <kbd>Del</kbd> to delete, <kbd>Ctrl+D</kbd> to duplicate, arrows to nudge.</li><li><b>Double-click an Active</b> to open the picture / animation editor. Select an object to edit its <b>Properties</b> (movement, values, text…) on the left.</li><li>Backdrops become walls with <i>Obstacle type</i>: Obstacle, Platform or Ladder.</li></ul>'+
  '<h3>3. Event Editor</h3><ul><li>Click <b>New condition</b>, click an object and choose a condition (for instance <i>Ball &gt; Collisions &gt; Another object</i>).</li><li>Then click the cell under the object that must act and choose an <b>action</b>. A check mark appears; hover it to read the actions.</li><li>Right-click conditions and line numbers for more options (negate, insert, groups, comments…). The <b>Event List Editor</b> shows the same events as text.</li><li>Values are <b>expressions</b>: <code>X( "Ball" ) + 10</code>, <code>Random(100)</code>, <code>Alterable Value A( "Hero" )</code>…</li></ul>'+
  '<h3>4. Run and build</h3><p><kbd>F8</kbd> runs the application, <kbd>F7</kbd> runs the current frame, <kbd>Esc</kbd> stops. <i>File &gt; Build</i> exports your game as one standalone HTML file. <i>File &gt; Save</i> downloads the project; it is also saved automatically in this browser.</p>'+
  '<p>Open <i>File &gt; Examples</i> to study three complete games.</p>'})})}
function showAbout(){msgBox('Fusion 2.5 Web\n\nA game and application creation tool that runs entirely in the browser: storyboard, frame, event and picture editors, movements, expressions and an HTML5 runtime.\n\nThis is an independent, unofficial recreation inspired by Clickteam Fusion 2.5. It is not affiliated with or endorsed by Clickteam.','About')}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(RT){if(e.code==='Escape'){stopRun();e.preventDefault()}return}
  if(DLGS.length){const d=DLGS[DLGS.length-1];if(d.onKey){d.onKey(e,d);return}
    if(e.key==='Escape'){if(MENUS.length)closeMenus(0);else d.cancel();e.preventDefault()}else if(e.key==='Enter'&&!/^(TEXTAREA|BUTTON)$/.test(e.target.tagName)){d.primary();e.preventDefault()}return}
  if(e.key==='Escape'){if(MENUS.length)closeMenus(0);else if(PLACING)cancelPlacing();return}
  const ctrl=e.ctrlKey||e.metaKey,inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.code==='F8'){e.preventDefault();runApp(false);return}if(e.code==='F7'){e.preventDefault();runApp(true);return}if(e.code==='F1'){e.preventDefault();showHelp();return}
  if(ctrl&&e.code==='KeyS'){e.preventDefault();cmdSave();return}if(ctrl&&e.code==='KeyO'){e.preventDefault();cmdOpen();return}
  if(inField)return;
  if(ctrl){
    if(e.code==='KeyZ'){e.preventDefault();if(e.shiftKey)redo();else undo()}else if(e.code==='KeyY'){e.preventDefault();redo()}
    else if(VIEW==='frame'){if(e.code==='KeyC'){e.preventDefault();copySel()}else if(e.code==='KeyX'){e.preventDefault();copySel();deleteSel()}else if(e.code==='KeyV'){e.preventDefault();pasteSel()}else if(e.code==='KeyD'){e.preventDefault();duplicateSel()}else if(e.code==='KeyA'){e.preventDefault();selectAll()}}
    else if(VIEW==='events'&&EVSEL){const i=EVSEL.list.indexOf(EVSEL.node);if(i<0)return;if(e.code==='KeyC'){e.preventDefault();EVCLIP={frameId:frame().id,node:clone(EVSEL.node)};status('Event copied')}else if(e.code==='KeyV'&&EVCLIP&&EVCLIP.frameId===frame().id){e.preventDefault();pushUndo();const n=reId(clone(EVCLIP.node));EVSEL.list.splice(i+1,0,n);EVSEL={list:EVSEL.list,node:n};renderEventEditor()}}
    return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();if(VIEW==='frame')deleteSel();else if(VIEW==='events')deleteSelectedEvent();return}
  if(VIEW==='frame'&&SEL.length&&e.key.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?10:1;nudgeSel(e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0)}
});
document.addEventListener('contextmenu',e=>{if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName))e.preventDefault()});
window.addEventListener('resize',()=>closeMenus(0));

/* ---------- start ---------- */
async function init(){
  buildMenubar();buildToolbar();
  let ok=false;
  try{const s=localStorage.getItem('fusionweb.autosave.v1');if(s){await loadProjectData(JSON.parse(s));ok=true}}catch(e){ok=false}
  if(!ok){EXAMPLES.breakout.build();resetState();CF=1}
  buildLibrary();refreshAll();
  let seen=true;try{seen=!!localStorage.getItem('fusionweb.welcome');localStorage.setItem('fusionweb.welcome','1')}catch(e){}
  if(!seen)showHelp()}
init();
</script>
